; PlatformIO project for the car2 drive-by-wire Teensy nodes.
;
; One project, four environments (one per Teensy). Each environment compiles
; exactly one node .cpp but they all share this folder's dbw_can.h.
;
; Build one node:      pio run -e throttle
; Build + upload:      pio run -e throttle -t upload      (Teensy plugged in via USB)
; Serial monitor:      pio device monitor -e master
; Build all four:      pio run
;
; The nodes live flat in this folder (not in src/), so src_dir points here and
; each env's build_src_filter selects just its own file.

[platformio]
src_dir = .

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
; FlexCAN_T4 ships with the Teensy core; these two are external:
lib_deps =
    adafruit/Adafruit MCP4725 @ ^2.0.0
    waspinator/AccelStepper @ ^1.64
    paulstoffregen/Encoder @ ^1.4
; To bring the bus up with plain (unprotected) CAN command frames first, set 0:
build_flags = -DDBW_E2E_ENABLE=1

[env:master]
build_src_filter = -<*> +<master.cpp>

[env:throttle]
build_src_filter = -<*> +<throttle.cpp>

[env:steer]
build_src_filter = -<*> +<steer.cpp>

[env:brake]
build_src_filter = -<*> +<brake.cpp>
